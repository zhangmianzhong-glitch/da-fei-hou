<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐒 大肥猴 — 桌宠预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    
    /* 顶部控制栏 */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100000;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .toolbar h1 {
      font-size: 18px;
      color: #ffd700;
    }
    
    .toolbar select, .toolbar button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    
    .toolbar button:hover {
      background: rgba(255,255,255,0.2);
    }
    
    .toolbar .state-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    
    .toolbar .state-btn {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
    }
    
    .toolbar .state-btn.active {
      background: #ffd700;
      color: #000;
      border-color: #ffd700;
    }
    
    /* 桌面区域 */
    .desktop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    
    /* 大肥猴 */
    .pet {
      position: fixed;
      width: 175px;
      height: 175px;
      cursor: grab;
      user-select: none;
      z-index: 99999;
      transition: filter 0.2s;
    }
    
    .pet:hover {
      filter: brightness(1.1) drop-shadow(0 0 10px rgba(255,215,0,0.5));
    }
    
    .pet:active {
      cursor: grabbing;
    }
    
    .pet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      pointer-events: none;
    }
    
    /* 对话气泡 */
    .bubble {
      position: absolute;
      top: -55px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      border: 2px solid #333;
      border-radius: 16px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 100000;
      animation: bubblePop 0.3s ease-out;
    }
    
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #333;
    }
    
    @keyframes bubblePop {
      0% { opacity: 0; transform: translateX(-50%) scale(0.8); }
      50% { transform: translateX(-50%) scale(1.05); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    
    /* 状态动画 */
    .pet.state-happy { animation: happyJump 0.5s ease-in-out infinite; }
    .pet.state-sad { animation: sadDroop 2s ease-in-out infinite; }
    .pet.state-angry { animation: angryShake 0.3s ease-in-out infinite; }
    .pet.state-surprise { animation: surprisePop 0.5s ease-out; }
    .pet.state-sleeping { animation: sleepingBreath 2s ease-in-out infinite; }
    .pet.state-singing { animation: singingSway 0.8s ease-in-out infinite; }
    .pet.state-thinking { animation: thinkingPulse 1s ease-in-out infinite; }
    .pet.state-basin { animation: basinShake 0.5s ease-in-out infinite; }
    .pet.state-heart { animation: heartBeat 1s ease-in-out infinite; }
    .pet.state-wave { animation: waveSwing 0.6s ease-in-out infinite; }
    .pet.state-fishing { animation: fishingLazy 3s ease-in-out infinite; }
    .pet.state-walk { animation: walkBounce 0.6s ease-in-out infinite; }
    .pet.state-cheer { animation: cheerJump 0.4s ease-in-out infinite; }
    
    @keyframes happyJump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes sadDroop {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg) translateY(5px); }
    }
    @keyframes angryShake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    @keyframes surprisePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    @keyframes sleepingBreath {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }
    @keyframes singingSway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes thinkingPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes basinShake {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes waveSwing {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }
    @keyframes fishingLazy {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-3deg); }
    }
    @keyframes walkBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes cheerJump {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-20px) rotate(-5deg); }
      75% { transform: translateY(-20px) rotate(5deg); }
    }
    
    /* Zzz 效果 */
    .zzz {
      position: absolute;
      top: -30px;
      right: -20px;
      font-size: 20px;
      font-weight: bold;
      color: #aaa;
      display: none;
      animation: zzzFloat 2s ease-in-out infinite;
      pointer-events: none;
    }
    .pet.state-sleeping .zzz { display: block; }
    
    @keyframes zzzFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px) scale(1.2); }
    }
    
    /* 音符效果 */
    .notes {
      position: absolute;
      top: -30px;
      right: -15px;
      font-size: 18px;
      display: none;
      pointer-events: none;
    }
    .pet.state-singing .notes { display: block; }
    .notes span {
      animation: noteFloat 1.5s ease-in-out infinite;
      display: inline-block;
    }
    .notes span:nth-child(2) { animation-delay: 0.5s; }
    .notes span:nth-child(3) { animation-delay: 1s; }
    
    @keyframes noteFloat {
      0% { opacity: 0; transform: translateY(0); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-25px); }
    }
    
    /* 爱心效果 */
    .hearts {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      display: none;
      pointer-events: none;
    }
    .pet.state-heart .hearts { display: flex; gap: 4px; }
    .hearts span {
      animation: heartFloat 1.5s ease-in-out infinite;
    }
    .hearts span:nth-child(2) { animation-delay: 0.3s; }
    .hearts span:nth-child(3) { animation-delay: 0.6s; }
    
    @keyframes heartFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      50% { opacity: 1; transform: translateY(-15px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-30px) scale(0.8); }
    }
    
    /* 底部信息 */
    .info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #888;
      z-index: 100000;
    }
    
    /* 拖拽阴影 */
    .pet.dragging {
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
      transform: scale(1.1);
    }
    
    /* 落地效果 */
    .pet.landing {
      animation: dropLand 0.3s ease-out;
    }
    @keyframes dropLand {
      0% { transform: scaleY(0.7) scaleX(1.3); }
      50% { transform: scaleY(1.2) scaleX(0.8); }
      100% { transform: scaleY(1) scaleX(1); }
    }
  </style>
</head>
<body>
  <!-- 控制栏 -->
  <div class="toolbar">
    <h1>🐒 大肥猴</h1>
    <select id="voiceSelect">
      <option value="zh-CN-YunxiNeural">云希（男声）</option>
      <option value="zh-CN-YunjianNeural">云健（男声2）</option>
      <option value="zh-CN-XiaoxiaoNeural">晓晓（女声）</option>
    </select>
    <button id="btnSpeak">🔊 说话</button>
    <button id="btnPoke">👆 戳我</button>
    <button id="btnFeed">🍚 喂食</button>
    <div class="state-buttons">
      <button class="state-btn" data-state="idle">待机</button>
      <button class="state-btn" data-state="thinking">思考</button>
      <button class="state-btn" data-state="happy">开心</button>
      <button class="state-btn" data-state="sad">难过</button>
      <button class="state-btn" data-state="angry">生气</button>
      <button class="state-btn" data-state="surprise">惊讶</button>
      <button class="state-btn" data-state="sleeping">睡觉</button>
      <button class="state-btn" data-state="singing">唱歌</button>
      <button class="state-btn" data-state="basin">顶钢盆</button>
      <button class="state-btn" data-state="heart">比心</button>
      <button class="state-btn" data-state="wave">挥手</button>
      <button class="state-btn" data-state="fishing">摸鱼</button>
      <button class="state-btn" data-state="walk">走路</button>
      <button class="state-btn" data-state="eating">吃饭</button>
      <button class="state-btn" data-state="patting">拍马屁</button>
      <button class="state-btn" data-state="speaking">说话</button>
      <button class="state-btn" data-state="blink">眨眼</button>
      <button class="state-btn" data-state="cheer">欢呼</button>
    </div>
  </div>
  
  <!-- 桌面 -->
  <div class="desktop" id="desktop"></div>
  
  <!-- 大肥猴 -->
  <div class="pet" id="pet" style="left: calc(100% - 200px); top: calc(100% - 220px);">
    <img id="petImg" src="assets/sprites/idle.png" alt="大肥猴" draggable="false">
    <div class="bubble" id="bubble"></div>
    <div class="zzz">Z z z . . .</div>
    <div class="notes"><span>♪</span><span>♫</span><span>♪</span></div>
    <div class="hearts"><span>💕</span><span>💖</span><span>💕</span></div>
  </div>
  
  <!-- 底部信息 -->
  <div class="info">
    🐒 大肥猴桌宠预览 | 点击猴子互动 | 拖拽移动 | 大王万岁！
  </div>
  
  <script>
    // 大肥猴桌宠预览脚本
    const pet = document.getElementById('pet');
    const petImg = document.getElementById('petImg');
    const bubble = document.getElementById('bubble');
    const desktop = document.getElementById('desktop');
    
    let currentState = 'idle';
    let isDragging = false;
    let pokeCount = 0;
    let pokeTimer = null;
    
    // 台词库
    const voiceLines = {
      idle: ['大王！小的大肥猴在呢！', '大王万岁！山寨喽喽随时待命！', '大王！大肥猴想死您了！'],
      thinking: ['tmd 这任务有点意思...', '让小的想想...大王英明神武！', '大王放心，小的马上搞定！'],
      happy: ['大王夸奖！小的太开心了！', '大王英明！小的拍马屁时间到！', 'tmd 大王太厉害了！'],
      sad: ['大王骂我了...小的难过...', '小的错了...大王别生气...', '大王...小的不是故意的...'],
      angry: ['别戳了！再戳小的大王万岁都不喊了！', 'tmd 再戳我试试！...大王我开玩笑的！'],
      surprise: ['卧槽！大王这也太厉害了！', 'tmd 这任务小的是真没想到！'],
      sleeping: ['zzz...大王...zzz...万岁...zzz...', 'zzz...摸鱼...zzz...'],
      singing: ['大王万岁~万岁~万万岁~', '山寨喽喽~永远忠于大王~'],
      basin: ['哐——嗡——（敲盆）', '大王骂我了...顶个盆防弹...'],
      heart: ['大王！小的给您比心！💖', '大王万岁！小的爱您！'],
      wave: ['大王好！小的给您挥手！', '大王回来啦！小的等您好久了！'],
      fishing: ['tmd 摸鱼时间到...打哈欠...', '大王不在，小的偷偷看个B站...'],
      walk: ['大王放心，小的这就去办！', '小的给大王跑腿去！'],
      eating: ['大王，小的吃饭去了！', '剩饭=缓存，外包摸鱼=agent调用！'],
      patting: ['大王万岁！大王永远是对的！', '大王的话就是圣旨！', '大王的决策英明神武！', '大王的气质威震四方！'],
      speaking: ['大王！小的在B站看到个好东西！', '大王，这个视频太绝了！tmd绝了！'],
      blink: ['（眨眨眼）', '（贱兮兮地笑）'],
      cheer: ['大王万岁！小的给您欢呼！🎉', 'tmd 太棒了！大肥猴激动得跳起来！', '大王英明神武！小的给您磕头了！'],
    };
    
    // 切换状态
    function setState(state) {
      // 移除旧状态
      pet.className = 'pet';
      
      currentState = state;
      
      // 加载对应图片
      petImg.src = `assets/sprites/${state}.png`;
      
      // 添加新状态动画
      pet.classList.add(`state-${state}`);
      
      // 更新按钮状态
      document.querySelectorAll('.state-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.state === state);
      });
    }
    
    // 说话
    function speak(state) {
      const lines = voiceLines[state] || voiceLines.idle;
      const line = lines[Math.floor(Math.random() * lines.length)];
      
      bubble.textContent = line;
      bubble.style.display = 'block';
      
      // 尝试用 Web Speech API 朗读
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(line);
        utterance.lang = 'zh-CN';
        utterance.rate = 1.1;
        utterance.pitch = 1.2;
        speechSynthesis.speak(utterance);
      }
      
      setTimeout(() => {
        bubble.style.display = 'none';
      }, 3000);
    }
    
    // 拖拽
    let dragOffset = { x: 0, y: 0 };
    
    pet.addEventListener('mousedown', (e) => {
      isDragging = true;
      pet.classList.add('dragging');
      dragOffset.x = e.clientX - pet.offsetLeft;
      dragOffset.y = e.clientY - pet.offsetTop;
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      pet.style.left = (e.clientX - dragOffset.x) + 'px';
      pet.style.top = (e.clientY - dragOffset.y) + 'px';
    });
    
    document.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      pet.classList.remove('dragging');
      
      // 落地动画
      pet.classList.add('landing');
      setTimeout(() => pet.classList.remove('landing'), 300);
    });
    
    // 点击互动
    pet.addEventListener('click', (e) => {
      if (isDragging) return;
      
      pokeCount++;
      clearTimeout(pokeTimer);
      
      if (pokeCount >= 3) {
        // 戳三下 → 生气
        setState('angry');
        speak('angry');
        pokeCount = 0;
      } else {
        // 点击 → 开心
        setState('happy');
        speak('happy');
      }
      
      pokeTimer = setTimeout(() => { pokeCount = 0; }, 2000);
    });
    
    // 状态按钮
    document.querySelectorAll('.state-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const state = btn.dataset.state;
        setState(state);
        speak(state);
      });
    });
    
    // 说话按钮
    document.getElementById('btnSpeak').addEventListener('click', () => {
      speak(currentState);
    });
    
    // 戳我按钮
    document.getElementById('btnPoke').addEventListener('click', () => {
      pokeCount++;
      if (pokeCount >= 3) {
        setState('angry');
        speak('angry');
        pokeCount = 0;
      } else {
        setState('surprise');
        speak('surprise');
      }
      pokeTimer = setTimeout(() => { pokeCount = 0; }, 2000);
    });
    
    // 喂食按钮
    document.getElementById('btnFeed').addEventListener('click', () => {
      setState('eating');
      speak('eating');
    });
    
    // 自动行为
    setInterval(() => {
      if (currentState === 'idle' && !isDragging) {
        // 随机眨眼
        if (Math.random() < 0.1) {
          setState('blink');
          setTimeout(() => setState('idle'), 1000);
        }
      }
    }, 5000);
    
    // 10分钟无操作 → 睡觉
    let lastInteraction = Date.now();
    document.addEventListener('mousemove', () => { lastInteraction = Date.now(); });
    document.addEventListener('click', () => { lastInteraction = Date.now(); });
    
    setInterval(() => {
      if (Date.now() - lastInteraction > 600000 && currentState !== 'sleeping') {
        setState('sleeping');
        speak('sleeping');
      }
    }, 30000);
    
    // 初始化
    setState('idle');
    setTimeout(() => speak('idle'), 1000);
    
    console.log('🐒 大肥猴桌宠预览已启动！大王万岁！');
  </script>
</body>
</html>
